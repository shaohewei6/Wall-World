# Paths are relative to this YAML file. Supply recorded trajectories in data/train.
config_dir: .
runtime:
  device: null                  # null inherits world_model.yaml
  precision: null               # null inherits world_model.yaml
  seed: 20260918
  cpu_threads: 4
data:
  root: ../data/train
  episode_ids: null             # use all episodes in the selected data directory
  batch_size: 16
  chunk_length: 15
  encoder_batch_size: 64
run:
  output: ../results/offline_training
  max_steps: 30                 # absolute optimizer-step target, including resume
  initialization: canonical
  resume: null
optimizer:
  name: adamw
  learning_rate: 0.0003
  weight_decay: 0.00001
  betas: [0.9, 0.999]
  eps: 1.0e-8
  max_grad_norm: 1.0
scheduler:
  name: warmup_cosine
  warmup_steps: 10
  schedule_steps: 1000
  minimum_learning_rate: 0.00001
checkpoint:
  save_every_steps: 10
  save_every_seconds: 60.0
logging:
  tqdm_mininterval: 1.0
